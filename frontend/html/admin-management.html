<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/LC%20Studio%20Logo.ico" type="image/x-icon" />
    <title>TraineeHub · Admin Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/admin-management.css?v=1" />
</head>
<body class="min-h-screen bg-background transition-colors duration-300">
    <!-- TOP BAR -->
    <header class="card-surface border-b border-border sticky top-0 z-40">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2 shrink-0 min-w-0">
                <svg width="36" height="36" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" class="topbar-logo" style="border-radius:8px;flex-shrink:0;">
                    <rect width="44" height="44" rx="10" fill="#f51c26"/>
                    <path d="M13 29V15H16.6L21.4 22.6L26.2 15H29.8V29H26.8V19.8L22.4 26.8H20.4L16 19.8V29H13Z" fill="white"/>
                    <rect x="31" y="15" width="3" height="14" rx="1.5" fill="white"/>
                </svg>
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-semibold text-sm text-foreground whitespace-nowrap" id="currentAdminEmail">Administrator</span>
                    <span class="text-xs text-muted-foreground hidden sm:inline">· Administrator</span>
                </div>
            </div>

            <nav class="topbar-nav">
                <a href="profile.html" class="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg transition-colors duration-150 text-muted-foreground hover:text-foreground hover:bg-muted">
                    <span>Dashboard</span>
                </a>
                <a href="admin-management.html" class="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg transition-colors duration-150 bg-primary/10 text-primary font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                    <span>Admins</span>
                </a>
            </nav>

            <div class="flex items-center gap-2 shrink-0">
                <button class="theme-btn p-2 rounded-lg transition-colors duration-150" id="themeToggle" aria-label="Toggle theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide text-muted-foreground" aria-hidden="true" id="themeIcon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
                </button>
                <button type="button" id="logoutBtn" class="flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground transition-colors duration-150 px-2 py-1.5 rounded-lg hover:bg-muted" style="background:none;border:none;cursor:pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 py-8">
        <!-- Header row -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-semibold text-foreground">Admin Management</h1>
                <p class="text-sm text-muted-foreground mt-0.5" id="adminCount">2 admins with access</p>
            </div>
            <button class="btn-primary" id="openAddAdminBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>
                Add Admin
            </button>
        </div>
        <div class="mb-4">
            <label for="adminSearch" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Search administrators</label>
            <input type="search" id="adminSearch" placeholder="Search by name or email" class="w-full" autocomplete="off" />
        </div>
        <p id="adminLoadError" class="error-text" role="alert" hidden></p>

        <!-- Admin table -->
        <div class="card-surface rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[700px]">
                    <thead>
                        <tr class="border-b border-border">
                            <th class="text-left px-4 py-3 muted-label show-sm">Email</th>
                            <th class="text-left px-4 py-3 muted-label show-lg">Added On</th>
                            <th class="text-left px-4 sm:px-6 py-3 muted-label"></th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- rows injected by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="empty-state-table" id="adminEmptyState" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true" style="color:var(--muted-foreground);opacity:0.4;display:block;margin:0 auto 12px;"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                <h3>No admins yet</h3>
                <p>Add one to get started.</p>
            </div>
        </div>
        <nav id="adminPagination" class="flex items-center gap-2 mt-4" aria-label="Administrator pages"></nav>
    </main>

    <!-- MODAL: Add Admin -->
    <div class="modal-overlay" id="addAdminModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Add New Admin</h2>
                <button class="modal-close" id="closeAddAdminBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <form id="addAdminForm">
                <div class="modal-body">
                    <div class="modal-field">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="adminEmail" placeholder="e.g. jane@traineehub.co.za" />
                        <div class="error-text" id="adminEmailError"></div>
                    </div>
                    <div class="modal-field">
                        <label>Password <span class="required">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="adminPassword" placeholder="Enter password" />
                            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye" aria-hidden="true" id="passwordIcon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div class="error-text" id="adminPasswordError"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-ghost" id="cancelAddAdminBtn">Cancel</button>
                    <button type="submit" class="btn-primary-sm" id="submitAddAdminBtn">Add Admin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- External JavaScript -->
    <script src="../js/admin-management.js"></script>
</body>
</html>
