<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LC Studio · Admin Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/frontend/css/admin-login.css?v=9" />
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="card-split">

                <aside class="card-art" aria-hidden="true"></aside>

                <section class="card-form">

                    <button id="themeToggle" class="toggle-track" aria-label="Toggle dark/light mode">
                        <i class="fas fa-moon" id="toggleIcon"></i>
                    </button>

                    <img src="/images/LC-STUDIO-HI-RES-LOGO-2023-redgrey.png" alt="LC Studio Logo" class="corner-logo"
                         style="position: absolute; top: 0.6rem; right: 3rem; height: 50px; width: auto; z-index: 5; opacity: 0.8;">

                    <div class="brand-header">
                        <div class="main-title">Admin Login</div>
                        <div class="description">
                            Secure access to the LC Studio Trainee Library.
                        </div>
                    </div>

                    <!-- LOGIN FORM -->
                    <form id="loginForm" class="space-y-2">

                        <div>
                            <label for="email" class="block text-xs font-medium card-text-secondary mb-1">Email Address</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 card-text-muted">
                                    <i class="fas fa-envelope text-xs"></i>
                                </span>
                                <input type="email" id="email" name="email" placeholder="e.g. admin@lctstudio.co.za" required
                                       class="form-input w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c70621] focus:border-transparent transition text-sm">
                            </div>
                            <div class="error-text" id="emailError" style="color:#f51c26;font-size:12px;margin-top:4px;min-height:14px;"></div>
                        </div>

                        <div>
                            <label for="password" class="block text-xs font-medium card-text-secondary mb-1">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 card-text-muted">
                                    <i class="fas fa-lock text-xs"></i>
                                </span>
                                <input type="password" id="password" name="password" placeholder="Enter your password" required
                                       class="form-input w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c70621] focus:border-transparent transition text-sm">
                                <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer" style="background:none;border:none;color:var(--muted-foreground,#9ca3af);z-index:6;" aria-label="Toggle password visibility">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                            <div class="error-text" id="passwordError" style="color:#f51c26;font-size:12px;margin-top:4px;min-height:14px;"></div>
                        </div>

                        <div id="loginError" class="login-error" role="alert"></div>

                        <button type="submit" id="signInBtn"
                                class="btn-primary w-full text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 text-sm">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>

                    </form>

                    <div class="text-center mt-4 pt-3 border-t divider">
                        <p class="text-[10px] card-text-muted tracking-widest">LC STUDIO &middot; ADMIN</p>
                    </div>

                </section>
            </div>
        </div>
    </div>

    <script src="/frontend/js/admin-login.js?v=10"></script>

</body>
</html>
