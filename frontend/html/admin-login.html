<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraineeHub — Sign In</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        /* Font face definitions moved inline to ensure they load */
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('/fonts/brandon-grotesque-light-58a8a4b38001d.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('/fonts/brandon-grotesque-regular-italic-58a8a456c4724.otf') format('opentype');
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('/fonts/brandon-grotesque-medium-italic-58a8a3c40866a.otf') format('opentype');
            font-weight: 500;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('/fonts/brandon-grotesque-bold-italic-58a8a48221563.otf') format('opentype');
            font-weight: 700;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Brandon Grotesque';
            src: url('/fonts/brandon-grotesque-black-58a8a3e824392.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <!-- Theme Toggle with SVG -->
        <button id="themeToggle" class="auth-theme-toggle" aria-label="Toggle theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
                <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
            </svg>
        </button>

        <section class="auth-shell card-surface">
            <header class="auth-brand">
                <!-- Inline SVG Logo -->
                <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" class="auth-logo">
                    <rect width="44" height="44" rx="10" fill="#E53E3E"/>
                    <path d="M13 29V15H16.6L21.4 22.6L26.2 15H29.8V29H26.8V19.8L22.4 26.8H20.4L16 19.8V29H13Z" fill="white"/>
                    <rect x="31" y="15" width="3" height="14" rx="1.5" fill="white"/>
                </svg>
                <h1>TraineeHub</h1>
            </header>
            <p class="auth-intro">Sign in to manage your trainee programme</p>
            <p class="auth-error" id="loginError" role="alert"></p>

            <form id="loginForm" novalidate>
                <label for="email">Email address</label>
                <input class="input-base" id="email" type="email" placeholder="nash@traineehub.co.za" autocomplete="email" required />
                <p class="auth-field-error" id="emailError"></p>

                <label for="password">Password</label>
                <div class="auth-password-wrap">
                    <input class="input-base" id="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required minlength="6" />
                    <button type="button" id="passwordToggle" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="auth-field-error" id="passwordError"></p>

                <div class="auth-options">
                    <label class="auth-remember">
                        <input id="remember" type="checkbox" />
                        <span>Remember me</span>
                    </label>
                    <button type="button" class="auth-link">Forgot password?</button>
                </div>

                <button class="btn-primary auth-submit" id="signInBtn" type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" x2="3" y1="12" y2="12"/>
                    </svg>
                    <span>Sign In</span>
                </button>
            </form>

            <aside class="demo-card">
                <div class="demo-heading">
                    <strong>Demo Account</strong>
                    <button type="button" id="autofillBtn">Autofill</button>
                </div>
                <div class="demo-row">
                    <div>
                        <small>Email</small>
                        <b>nash@traineehub.co.za</b>
                    </div>
                    <button type="button" class="copy-btn" data-copy="nash@traineehub.co.za" aria-label="Copy email">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
                <div class="demo-row">
                    <div>
                        <small>Password</small>
                        <b>TraineeHub@2026</b>
                    </div>
                    <button type="button" class="copy-btn" data-copy="TraineeHub@2026" aria-label="Copy password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
            </aside>
        </section>
        <p class="auth-copyright">© 2026 TraineeHub. All rights reserved.</p>
    </main>
    <script src="../js/admin-login.js"></script>
</body>
</html>
